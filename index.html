/* ================= GENERATION ================= */
function climateOf(lat){const a=Math.abs(lat);const zone=a<23.5?'tropisch':a<35?'subtropisch':a<50?'gemaessigt':a<60?'kuehl':'nordisch';return {lat,abs:a,hemi:lat<0?'S':'N',zone,meta:ZMETA[zone]};}
function sunModel(clim){
  const aS=Math.min(89.5,90-clim.abs+23.44),aW=90-clim.abs-23.44;
  return {aS,aW,oh:clamp(2.05/Math.tan(rad(Math.max(aS,15))),.15,2.4),polar:aW<=0,midnight:clim.abs>66.56};
}
function generate(st){return st.buildingType==='mfh'?generateMFH(st):generateEFH(st);}

/* ---------- EINFAMILIENHAUS ---------- */
function generateEFH(st){
  const t0=performance.now();const rng=mulberry32((st.seed>>>0)||1);let idc=0;const uid=()=>'r'+(++idc);
  const notes=new Set();const clim=climateOf(st.lat);
  const effFloors=clamp(st.floors,1,Math.max(1,Math.floor(st.area/50)));
  if(effFloors<st.floors)notes.add(tf('noteFloors',{n:effFloors}));
  const grossPF=st.area*1.18/effFloors;
  const typo=st.typo==='riegel'?'riegel':'kompakt';
  let depth=typo==='riegel'?clim.meta.depth+rr(rng,-.3,.3):clamp(Math.sqrt(grossPF/1.28),clim.meta.depth-.6,clim.meta.depth+3.2);
  let W=grossPF/depth;
  if(W<6.4){depth=grossPF/6.4;W=6.4;}
  if(W>19){depth=grossPF/19;W=19;}
  const corr=clim.zone==='nordisch'?1.4:1.3;
  const bandT=depth-corr,shadeD=bandT*clim.meta.nsh,sunD=bandT-shadeD;
  const bands={shade:{x:0,y:0,w:W,h:shadeD},corr:{x:0,y:shadeD,w:W,h:corr},sun:{x:0,y:shadeD+corr,w:W,h:sunD}};
  const k=clamp(st.area/140,.7,1.6);
  const kidBase=Math.max(0,st.persons-2),kidN=Math.min(kidBase,4);
  const kidPer=Array(kidN).fill(1);let rem=kidBase-kidN;
  for(let i=0;rem>0;i=(i+1)%Math.max(1,kidN)){kidPer[i]++;rem--;}
  if(kidBase>4)notes.add(ts('noteKids'));
  let kindIdx=0;
  const mkKind=()=>{const p=kidPer[kindIdx]||1;kindIdx++;return {type:'kind',target:11.5*k*Math.max(1,p*.8),min:p>1?2.7:2.4,merged:p};};
  const IT={wohnen:()=>({type:'wohnen',target:24*k,min:2.8}),essen:()=>({type:'essen',target:12*k,min:2.2,opt:3}),kochen:()=>({type:'kochen',target:Math.min(11*k,16),min:1.9}),
    bad:n=>({type:'bad',target:8*k,min:1.7,name:n||rmName('bad')}),wc:()=>({type:'wc',target:3.2,min:1.3,opt:1}),
    tech:()=>({type:'technik',target:5,min:1.4,opt:4}),speise:()=>({type:'speise',target:3.6,min:1.3,opt:7}),schlafen:()=>({type:'schlafen',target:16*k,min:2.6}),
    arbeiten:n=>({type:'arbeiten',target:10*k,min:2.2,opt:5,name:n||rmName('arbeiten')}),ankleide:()=>({type:'ankleide',target:5.5,min:1.6,opt:6}),
    treppe:()=>({type:'treppe',fixed:2.4,target:2.4*shadeD,min:2.2}),gast:()=>({type:'gast',target:12*k,min:2.4}),hobby:()=>({type:'hobby',target:12*k,min:2.4,name:rmName('hobby')})};
  function program(level){
    const shade=[],sun=[];const cold=clim.zone==='kuehl'||clim.zone==='nordisch';
    if(effFloors===1){
      sun.push(IT.wohnen());if(st.area>=120)sun.push(IT.essen());sun.push(IT.schlafen());
      shade.push(IT.kochen(),IT.bad());for(let i=0;i<kidN;i++)shade.push(mkKind());
      if(st.persons>=3||st.area>=110)shade.push(IT.wc());
      if(cold)shade.push(IT.tech());if(clim.zone==='tropisch')shade.push(IT.speise());
      if(st.persons>=2&&st.area>=150)sun.push(IT.arbeiten());
    }else if(level===0){
      sun.push(IT.wohnen());if(st.area>=120)sun.push(IT.essen());if(st.area>=170&&st.persons>=2)sun.push(IT.arbeiten());
      shade.push(IT.treppe(),IT.kochen());
      if(st.persons>=3||st.area>=110)shade.push(IT.wc());
      if(cold)shade.push(IT.tech());
      if(clim.zone==='tropisch')shade.push(IT.speise());
    }else if(level===1&&effFloors===2){
      sun.push(IT.schlafen());for(let i=0;i<kidN;i++)sun.push(mkKind());
      if(kidN===0&&st.persons>=2&&st.area>=120)sun.push(IT.arbeiten());if(kidN===0&&st.area>=170)sun.push(IT.gast());
      shade.push(IT.treppe(),IT.bad());if(st.persons>=2&&grossPF>=80)shade.push(IT.ankleide());
    }else if(level===1){
      sun.push(IT.schlafen());const a=Math.ceil(kidN/2);for(let i=0;i<a;i++)sun.push(mkKind());
      if(kidN===0)sun.push(IT.arbeiten());shade.push(IT.treppe(),IT.bad());if(st.persons>=2)shade.push(IT.ankleide());
    }else{
      const b=kidN-Math.ceil(kidN/2);for(let i=0;i<b;i++)sun.push(mkKind());
      if(b===0){sun.push(IT.gast());sun.push(st.persons>=2?IT.arbeiten(rmName('hobby')):IT.hobby());}
      else if(st.area>=170)sun.push(IT.arbeiten());
      shade.push(IT.treppe(),IT.bad(rmName('bad')+' 2'));
    }
    return {shade,sun};
  }
  function allocate(band,items){
    const rooms=[];let x=band.x;
    const fixed=items.filter(i=>i.fixed),flex=items.filter(i=>!i.fixed);
    const mkRoom=(i,xx,w)=>({id:uid(),type:i.type,name:i.name||null,zone:RZONE[i.type],x:xx,y:band.y,w,h:band.h,merged:i.merged||1,unit:0});
    for(const f of fixed){const w=Math.min(f.fixed,band.w*.4);rooms.push(mkRoom(f,x,w));x+=w;}
    const avail=band.w-(x-band.x);
    flex.forEach(i=>{i.t=i.target*rr(rng,.92,1.08);});
    const tot=flex.reduce((s,i)=>s+i.t,0);
    if(tot>0){const f=clamp(band.w*band.h/tot,.65,1.45);flex.forEach(i=>i.t*=f);}
    const sumMin=l=>l.reduce((s,i)=>s+i.min,0);
    const opts=flex.filter(i=>i.opt).sort((a,b)=>b.opt-a.opt);
    for(const o of opts){if(sumMin(flex)<=avail)break;flex.splice(flex.indexOf(o),1);}
    while(sumMin(flex)>avail){const ks=flex.filter(i=>i.type==='kind');if(ks.length<2)break;
      const a=ks[ks.length-2],b=ks[ks.length-1];a.t=(a.t+b.t)*.9;a.min=2.7;a.merged=(a.merged||1)+(b.merged||1);flex.splice(flex.indexOf(b),1);notes.add(ts('noteKids'));}
    let sc=1;if(sumMin(flex)>avail&&flex.length){sc=avail/sumMin(flex);notes.add(ts('noteCompact'));}
    if(!flex.length)return rooms;
    let ws=flex.map(i=>Math.max(i.min*sc,i.t/band.h));const mins=flex.map(i=>i.min*sc);
    let sum=ws.reduce((a,b)=>a+b,0);
    if(sum>avail){const sm=mins.reduce((a,b)=>a+b,0);const tt=sum-sm>1e-6?clamp((avail-sm)/(sum-sm),0,1):0;ws=ws.map((w,j)=>mins[j]+(w-mins[j])*tt);}
    else if(sum<avail){const extra=avail-sum;const wg=flex.map(i=>i.type==='wohnen'||i.type==='schlafen'?4:i.type==='kind'?1.6:1);const sw=wg.reduce((a,b)=>a+b,0)||1;ws=ws.map((w,j)=>w+extra*wg[j]/sw);}
    flex.forEach((i,j)=>{rooms.push(mkRoom(i,x,ws[j]));x+=ws[j];});
    return rooms;
  }
  const mirror=rng()<.5,flipY=clim.hemi==='S';
  const floors=[];
  for(let lv=0;lv<effFloors;lv++){
    const pr=program(lv);
    const shadeRooms=allocate(bands.shade,pr.shade),sunRooms=allocate(bands.sun,pr.sun);
    const diele={id:uid(),type:'diele',name:lv===0?rmName('diele'):rmName('flur'),zone:'verkehr',...bands.corr,merged:1,unit:0};
    const rooms=[...shadeRooms,diele,...sunRooms].filter(validRect);
    const outdoor=[];
    const wo=rooms.find(r=>r.type==='wohnen');
    const cold=clim.zone==='kuehl'||clim.zone==='nordisch';
    if(lv===0&&cold){const wh=1.9;rooms.push({id:uid(),type:'windfang',name:rmName('windfang'),zone:'nutzen',x:-1.7,y:bands.corr.y+(corr-wh)/2,w:1.7,h:wh,merged:1,unit:0});}
    const addOut=(type,x,y,w,h)=>outdoor.push({id:uid(),type,name:rmName(type),zone:'aussen',x,y,w,h,merged:1,unit:0});
    if(lv===0&&wo){
      if(clim.zone==='tropisch')addOut('veranda',0,depth,W,1.8);
      else if(clim.zone==='nordisch')addOut('wintergarten',wo.x+(wo.w-Math.min(4.2,wo.w-.4))/2,depth,Math.min(4.2,wo.w-.4),1.6);
      else addOut('terrasse',wo.x,depth,Math.min(clim.zone==='kuehl'?3.6:5,wo.w),clim.zone==='kuehl'?1.8:2.2);
    }
    const all=[...rooms,...outdoor];
    if(mirror)all.forEach(r=>{r.x=W-r.x-r.w;});
    if(flipY)all.forEach(r=>{r.y=depth-r.y-r.h;});
    const walls=wallsFor(rooms);
    const ops=openingsFor({rooms,outdoor,walls,level:lv},{W,D:depth,clim,hemi:clim.hemi,rng});
    floors.push({level:lv,rooms,outdoor,walls,ops,units:null,bands:{shade:{...bands.shade},corr:{...bands.corr},sun:{...bands.sun}},notch:null});
  }
  if(flipY)floors.forEach(f=>{['shade','corr','sun'].forEach(b=>{const r=f.bands[b];r.y=depth-r.y-r.h;});});
  let kn=0;
  floors.forEach(f=>f.rooms.forEach(r=>{
    if(r.type==='kind'){kn++;r.name=r.merged>1?`${rmName('kind')} · ${r.merged} ${ts('kindP')}`:`${rmName('kind')} ${kn}`;}
    if(!r.name)r.name=rmName(r.type);
  }));
  const stats=collectStats(floors,W,depth,0,effFloors);
  const rate=2900*clim.meta.cost*(effFloors>1?.97:1)*(typo==='riegel'?1.03:1);
  const zi={tropisch:0,subtropisch:1,gemaessigt:2,kuehl:3,nordisch:4}[clim.zone];
  const project=pickProject(t('proj'),zi,rng);
  const pool=t('tips')[clim.zone];
  const tips=[asText(pool[Math.floor(rng()*pool.length)]),asText(pool[(Math.floor(rng()*pool.length)+1)%pool.length]),
    tf('tipPersons',{n:st.persons,r:stats.roomCount,f:effFloors,a:fmt0(stats.net/Math.max(1,st.persons))})];
  return {buildingType:'efh',seed:st.seed,clim,effFloors,typo,W,D:depth,corr,shadeD,sunD,notch:null,floors,
    units:1,unitsPerFloor:[1],avgUnit:stats.net,hasLift:false,
    stats:{...stats,cost:stats.gross*rate,rate},sun:sunModel(clim),tips:[...new Set(tips)].slice(0,3),notes:[...notes],project,ms:performance.now()-t0};
}

/* ---------- MEHRFAMILIENHAUS ---------- */
function pickZi(area,rng){
  let zi=area<40?1:area<62?2:3;
  if(zi===3&&rng()<.3)zi=2;
  if(zi===2&&area>78&&rng()<.45)zi=3;
  return zi;
}
function addUnit(ctx,rect,unitNo,zi,serviceAtTop){
  const {rooms,uid}=ctx;
  const hallW=clamp(rect.w*.17,.95,1.35);
  rooms.push({id:uid(),type:'uflur',name:`${ts('unitShort')} ${unitNo}`,zone:'verkehr',x:rect.x,y:rect.y,w:hallW,h:rect.h,merged:1,unit:unitNo});
  const rx=rect.x+hallW,rw=Math.max(1.7,rect.w-hallW);
  const hN=clamp(rect.h*.36,2.1,2.9),hS=Math.max(1.9,rect.h-hN);
  const yServ=serviceAtTop?rect.y:rect.y+rect.h-hN;
  const yLive=serviceAtTop?rect.y+hN:rect.y;
  const badW=clamp(rw*.42,1.5,2.5);
  rooms.push({id:uid(),type:'bad',name:rmName('bad'),zone:'nass',x:rx,y:yServ,w:badW,h:hN,merged:1,unit:unitNo});
  rooms.push({id:uid(),type:'kochen',name:rmName('kochen'),zone:'tag',x:rx+badW,y:yServ,w:Math.max(1.2,rw-badW),h:hN,merged:1,unit:unitNo});
  if(zi===1){
    rooms.push({id:uid(),type:'wohnen',name:rmName('wohnschlafen'),zone:'tag',x:rx,y:yLive,w:rw,h:hS,merged:1,unit:unitNo});
  }else if(zi===2){
    const lw=rw*.58;
    rooms.push({id:uid(),type:'wohnen',name:rmName('wohnen'),zone:'tag',x:rx,y:yLive,w:lw,h:hS,merged:1,unit:unitNo});
    rooms.push({id:uid(),type:'schlafen',name:rmName('schlafen'),zone:'nacht',x:rx+lw,y:yLive,w:rw-lw,h:hS,merged:1,unit:unitNo});
  }else{
    const lw=rw*.46,bw=rw*.30;
    rooms.push({id:uid(),type:'wohnen',name:rmName('wohnen'),zone:'tag',x:rx,y:yLive,w:lw,h:hS,merged:1,unit:unitNo});
    rooms.push({id:uid(),type:'schlafen',name:rmName('schlafen'),zone:'nacht',x:rx+lw,y:yLive,w:bw,h:hS,merged:1,unit:unitNo});
    rooms.push({id:uid(),type:'kind',name:rmName('kind'),zone:'nacht',x:rx+lw+bw,y:yLive,w:Math.max(1.1,rw-lw-bw),h:hS,merged:1,unit:unitNo});
  }
}
function generateMFH(st){
  const t0=performance.now();
  const rng=mulberry32((st.seed>>>0)||1);
  let idc=0;const uid=()=>'u'+(++idc);
  const notes=new Set();
  const clim=climateOf(st.lat);
  const units=clamp(Math.round(st.units),2,16);
  let effFloors=clamp(Math.round(st.floors),2,4);
  if(effFloors>units){effFloors=Math.max(2,units);notes.add(tf('noteFloors',{n:effFloors}));}
  const per=[];let left=units;
  for(let i=0;i<effFloors;i++){const rem=effFloors-i;const n=Math.max(1,Math.ceil(left/rem));per.push(n);left-=n;}
  const typo=st.typoM==='kompakt'?'kompakt':'riegel';

    uD=clamp(unitArea/sliceW,5.4,8.6);
    W=coreW+m*sliceW;
    if(W>24){W=24;sliceW=(W-coreW)/m;uD=clamp(unitArea/sliceW,5.4,9.4);}

    notes.add(ts('noteNorth'));
  }else{
    layout='bar';shadeD=4.2;corrD=1.5;
    let sliceW=clamp(unitArea/6.9,4.4,11);
    let uD=clamp(unitArea/sliceW,5.6,9.6);
    W=coreW+maxPer*sliceW;
    if(W>24){W=24;sliceW=(W-coreW)/maxPer;uD=clamp(unitArea/sliceW,5.6,10.5);}
    sunD=uD;D=shadeD+sunD;
  }
  W=Math.max(coreW+4.4,W);D=Math.max(6.4,D);
  if((W-coreW)/maxPer<4.4)notes.add(ts('noteUnitsTight'));
  const netPlan=layout==='double'?(W-coreW)*(shadeD+sunD)*effFloors:(W-coreW)*sunD*effFloors;
  if(Math.abs(netPlan-st.area)/st.area>.14)notes.add(ts('noteAreaAdj'));

  const floors=[];const ziCount={1:0,2:0,3:0};let unitNo=0;
  for(let lv=0;lv<effFloors;lv++){

    const ctx={rooms,uid};
    let corridor,bandShade,bandSun;
    const barFloor=(layout==='bar')||n===1;
    if(barFloor){
      const sD=layout==='bar'?shadeD:4.2;
      const uH=Math.max(4.6,D-sD);
      const galY=Math.max(1.3,sD-corrD);
      rooms.push({id:uid(),type:'treppe',name:rmName('stair'),zone:'verkehr',x:0,y:0,w:coreW,h:sD,merged:1,unit:0});
      corridor={id:uid(),type:'diele',name:rmName('mflur'),zone:'verkehr',x:coreW,y:galY,w:W-coreW,h:sD-galY,merged:1,unit:0,nonNet:true};
      const items=[];
      if(hasLift)items.push({type:'lift',w:1.9,opt:0});
      items.push({type:'technik',w:2.7,opt:0});
      items.push({type:'waschen',w:2.9,opt:1});
      const availN=W-coreW;let sumN=items.reduce((s,i)=>s+i.w,0);
      while(sumN>availN){const o=items.filter(i=>i.opt>0).sort((a,b)=>b.opt-a.opt)[0];if(!o)break;items.splice(items.indexOf(o),1);sumN=items.reduce((s,i)=>s+i.w,0);}
      let wsN=items.map(i=>i.w);
      if(sumN>availN&&sumN>0){const f=availN/sumN;wsN=wsN.map(w=>w*f);}
      else if(sumN<availN&&items.length)wsN[items.length-1]+=availN-sumN;
      let nx=coreW;
      items.forEach((i,j)=>{rooms.push({id:uid(),type:i.type,name:rmName(i.type),zone:RZONE[i.type],x:nx,y:0,w:wsN[j],h:galY,merged:1,unit:0});nx+=wsN[j];});
      rooms.push(corridor);
      const sliceW=(W-coreW)/n;

        const rect={x:ux,y:sD,w:sliceW,h:uH};

        addUnit(ctx,rect,unitNo,zi,true);

        if(lv===0)outdoor.push({id:uid(),type:'terrasse',name:rmName('terrasse'),zone:'aussen',x:ux+.2,y:D,w:sliceW-.4,h:1.8,merged:1,unit:unitNo});

function regenerate(opts={}){

    try{
      M=generate(S);

      M.project=asText(M.project)||'HAUS MERIDIAN';
      S.floorView=clamp(S.floorView,0,M.effFloors-1);
      buildTabs();renderPlan(opts);renderAnalysis();done=true;
    }catch(err){
      console.error('synthesis',err);fell=true;
      if(a===0){if(isMFH())S.typoM='riegel';else S.typo='kompakt';S.floorView=0;}
      else{S.buildingType='efh';S.typo='kompakt';S.floorView=0;}
    }
  }
  if(!done){setStatus('—');return;}
  if(fell)M.notes.push(ts('noteFallback'));
  const note=$('statusNote');
  if(M.notes.length){note.hidden=false;note.textContent='⚠ '+asText(M.notes[0]);}else note.hidden=true;
  const stats=S.elevations
    ?`1:100 · 4 ${ts('elevTab')} · ${ts('pitch')} ${M.clim.meta.pitch}° · ${M.stats.winCount} ${ts('windows')}`
    :isMFH()?`M 1:${S.scale} · ${M.units} ${ts('unitShort')} · ${mTypoName(M.typo)} · Ø ${fmt(M.avgUnit)} m² · ${Math.round(M.ms)} ms`
